name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6     # zaktualizowane

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-artifact@v7   # zaktualizowane

        with:
          name: github-pages
          path: '.'                     # cały folder (index.html jest w root)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
